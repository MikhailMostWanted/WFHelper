name: Format OCR Diagnostics

on:
  push:
    branches:
      - "feat/russian-ocr-hardening"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/russian-ocr-hardening
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format diagnostics
        run: pnpm exec prettier --write ipc/systemIpc.ts services/rewardRussianOcr.ts services/rewardScannerSlotScan.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipc/systemIpc.ts services/rewardRussianOcr.ts services/rewardScannerSlotScan.ts
          git commit -m "[chore] - format OCR diagnostics"
          git push --no-verify origin HEAD:feat/russian-ocr-hardening
