name: Windows Russian Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/russian-ui-ocr

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test Russian reward OCR bridge
        run: pnpm exec vitest run tests/main/rewardRussianOcr.test.ts

      - name: Build Windows installer
        run: pnpm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WFHelper-RU-Windows
          path: |
            release/*Setup.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
