name: Apply WTB pass 2

on:
  push:
    branches:
      - feat/russian-ui-ocr

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == '[chore] - rerun wtb pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/russian-ui-ocr
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Worker dependencies
        run: npm ci --prefix backend/worker

      - name: Apply instant market pricing changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-wtb-pass.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n\n      - name: Format touched files and Russian catalogue"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('could not locate embedded WTB patch')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          body = textwrap.dedent(body)
          body = body.replace(
              "ranked_anchor = '''    if (\n    needs.price &&\n    needs.orders &&\n    isRankedListingItem &&\n    item.tradable === true &&\n    rankedMaxRank != null'''",
              "ranked_anchor = '''    if (\n      needs.price &&\n      needs.orders &&\n      isRankedListingItem &&\n      item.tradable === true &&\n      rankedMaxRank != null'''",
              1,
          )
          body = body.replace(
              "'''      {#if basicFiltersEnabled}\n      <SharedFilterBar''',",
              "'''      {#if basicFiltersEnabled}\n        <SharedFilterBar''',",
              1,
          )
          Path('/tmp/apply_wtb.py').write_text(body)
          PY
          python /tmp/apply_wtb.py

          python <<'PY'
          from pathlib import Path

          p = Path('config/shared/wfmCacheKeys.ts')
          text = p.read_text()
          old = '''export function rendererOrderSummaryCacheKey(slug: string, rank: number | null): string | null {
            return rank == null ? null : `${slug}:r${rank}`;
          }'''
          new = '''export function rendererOrderSummaryCacheKey(slug: string, rank: number | null): string {
            return rank == null ? slug : `${slug}:r${rank}`;
          }'''
          if text.count(old) != 1:
              raise SystemExit('wfmCacheKeys: rankless renderer summary key anchor failed')
          p.write_text(text.replace(old, new, 1))

          p = Path('src/lib/inventoryMarketSide.ts')
          text = p.read_text()
          old = 'export interface InventoryMarketPriceItem {'
          if text.count(old) != 1:
              raise SystemExit('inventoryMarketSide: internal interface export anchor failed')
          p.write_text(text.replace(old, 'interface InventoryMarketPriceItem {', 1))

          p = Path('tests/main/wfmCacheKeys.test.ts')
          text = p.read_text()

          anchor = '    expect(rendererOrderSummaryCacheKey("serration", 10)).toBe("serration:r10");'
          if text.count(anchor) != 1:
              raise SystemExit('wfmCacheKeys test: renderer summary anchor failed')
          text = text.replace(
              anchor,
              '    expect(rendererOrderSummaryCacheKey("serration", null)).toBe("serration");\n' + anchor,
              1,
          )

          anchor = '    const workerSummary = workerOrderSummaryCacheKey("serration", 10);'
          if text.count(anchor) != 1:
              raise SystemExit('wfmCacheKeys test: worker summary anchor failed')
          text = text.replace(
              anchor,
              anchor + '\n    const workerRanklessSummary = workerOrderSummaryCacheKey("serration", null);',
              1,
          )

          anchor = '    expect(snapshotCacheKeyFromWorkerKey(workerOrdersCacheKey("serration", 10))).toBeNull();'
          if text.count(anchor) != 1:
              raise SystemExit('wfmCacheKeys test: snapshot insertion anchor failed')
          rankless_assertion = '''    expect(snapshotCacheKeyFromWorkerKey(workerRanklessSummary)).toBe(
              rendererOrderSummaryCacheKey("serration", null),
            );'''
          text = text.replace(anchor, rankless_assertion + '\n' + anchor, 1)
          p.write_text(text)
          PY

      - name: Format repository
        run: pnpm exec prettier --write .

      - name: Verify formatting
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Focused tests
        run: >-
          pnpm exec vitest run
          tests/renderer/lib/instantMarketPricing.test.ts
          tests/renderer/lib/wfm/orderSummaryCache.test.ts
          tests/renderer/lib/inventoryMarket.test.ts
          tests/main/wfmCacheKeys.test.ts
          tests/main/russianI18n.test.ts

      - name: Backend tests
        shell: bash
        run: |
          set -o pipefail
          pnpm run backend:test 2>&1 | tee backend-test.log

      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-test.log
          if-no-files-found: error

      - name: Deadcode check
        run: pnpm run audit:deadcode

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "MikhailMostWanted"
          git config user.email "159386897+MikhailMostWanted@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[feat] - add instant market pricing"
          git push origin HEAD:feat/russian-ui-ocr
