name: WantedFrame Next

on:
  push:
    branches: [feat/wantedframe-next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wantedframe-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/wantedframe-next'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sources.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        if: hashFiles('.github/account-bridge-format-once') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('.github/account-bridge-format-once') != ''
        with:
          node-version: 22
          cache: pnpm
      - name: Normalize the final bridge sources once
        if: hashFiles('.github/account-bridge-format-once') != ''
        shell: bash
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --write services/accountBridge.ts services/accountBridgeRuntime.ts services/accountBridgeSync.ts services/bridgeExport.ts services/accountSnapshotStore.ts services/codexProfile.ts ipc/accountSnapshotIpc.ts src/components/settings/AccountSnapshotCard.svelte tests/bridge/build_fixture.cjs integrations/wantedframe_mcp/schema.json
          pnpm exec eslint services/accountBridge.ts services/accountBridgeRuntime.ts services/accountBridgeSync.ts services/bridgeExport.ts services/accountSnapshotStore.ts services/codexProfile.ts ipc/accountSnapshotIpc.ts src/components/settings/AccountSnapshotCard.svelte tests/bridge/build_fixture.cjs
          git add services/accountBridge.ts services/accountBridgeRuntime.ts services/accountBridgeSync.ts services/bridgeExport.ts services/accountSnapshotStore.ts services/codexProfile.ts ipc/accountSnapshotIpc.ts src/components/settings/AccountSnapshotCard.svelte tests/bridge/build_fixture.cjs integrations/wantedframe_mcp/schema.json
          git rm .github/account-bridge-format-once
      - name: Record exact prepared sources
        id: sources
        shell: bash
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          if ! git diff --cached --quiet; then
            remote=$(git ls-remote origin refs/heads/feat/wantedframe-next | cut -f1)
            test "$remote" = "$GITHUB_SHA" || { echo 'Branch changed; refusing to overwrite'; exit 1; }
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[chore] - normalize account bridge sources for handoff'
            git push origin HEAD:refs/heads/feat/wantedframe-next
          fi
          test -f integrations/wantedframe_mcp/schema.json
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  source:
    needs: prepare
    if: github.ref == 'refs/heads/feat/wantedframe-next'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Archive the exact tracked source revision
        run: git archive --format=tar.gz --output=wantedframe-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: WantedFrame-Next-source
          path: wantedframe-source.tar.gz
          retention-days: 7
          if-no-files-found: error

  account-data:
    needs: prepare
    if: github.ref == 'refs/heads/feat/wantedframe-next'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --prefix /tmp/wantedframe-ts typescript@5.9.3
      - run: node tests/bridge/build_fixture.cjs
        env:
          TYPESCRIPT_PATH: /tmp/wantedframe-ts/node_modules/typescript
      - run: python -m pip install './integrations[test]'
      - run: python -m pytest -q tests/bridge
      - run: python -m compileall -q integrations/wantedframe_mcp

  preview:
    needs: [prepare, account-data]
    if: github.ref == 'refs/heads/feat/wantedframe-next'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VITE_APP_VERSION: "0.3.0-preview.3"
      SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
      HUSKY: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VITE_WFM_BACKEND_URL: "https://api.wfhelper.com"
      VITE_WFM_BACKEND_DIRECT_FALLBACK: "high"
      VITE_WFM_BACKEND_BOOTSTRAP_ENABLED: "1"
    steps:
      - name: Preserve exact source newlines
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck main renderer and tests
        shell: bash
        run: |
          pnpm run typecheck:main
          pnpm run typecheck:renderer
          pnpm run typecheck:tests
      - name: Targeted regression tests
        run: pnpm exec vitest run tests/main/wantedframeNext.test.ts tests/main/rivenRussianIntegration.test.ts tests/main/rewardRussianOcr.test.ts tests/main/rivenScanOcr.test.ts tests/main/personalLoadouts.test.ts tests/main/gameLocale.test.ts
      - name: Set artifact-only version and record provenance
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.3.0-preview.3';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          fs.writeFileSync('source-revision.txt', process.env.SOURCE_REVISION + '\n');
          fs.writeFileSync('build-info.json', JSON.stringify({version: pkg.version, revision: process.env.SOURCE_REVISION, runId: process.env.GITHUB_RUN_ID}, null, 2) + '\n');
          NODE
      - name: Build Windows preview without publishing a release
        shell: bash
        run: |
          pnpm run verify:onnx-models
          pnpm run build
          cp source-revision.txt .electron-build/source-revision.txt
          cp build-info.json .electron-build/build-info.json
          pnpm exec electron-builder --win nsis --publish never
      - name: Packaged application smoke test
        run: pnpm run test:packaged release/win-unpacked/WantedFrame.exe
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: WantedFrame-0.3.0-preview.3-Windows
          path: |
            release/WantedFrame-0.3.0-preview.3-Setup.exe
            release/WantedFrame-0.3.0-preview.3-Setup.exe.blockmap
            release/latest.yml
            source-revision.txt
            build-info.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WantedFrame-Next-checks
          path: |
            test-results/packaged-*/
            source-revision.txt
            build-info.json
          if-no-files-found: ignore
          retention-days: 7
