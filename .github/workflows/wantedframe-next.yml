name: WantedFrame Next

on:
  push:
    branches: [feat/wantedframe-next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wantedframe-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bundle exact tracked sources
        run: git archive --format=tar.gz --output=wantedframe-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: WantedFrame-Next-source
          path: wantedframe-source.tar.gz
          retention-days: 7
          if-no-files-found: error
