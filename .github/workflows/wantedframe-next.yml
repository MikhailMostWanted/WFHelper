name: WantedFrame Next

on:
  push:
    branches: [feat/wantedframe-next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wantedframe-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.ref == 'refs/heads/feat/wantedframe-next'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive the exact tracked source revision
        run: git archive --format=tar.gz --output=wantedframe-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: WantedFrame-Next-source
          path: wantedframe-source.tar.gz
          retention-days: 7
          if-no-files-found: error

  preview:
    if: github.ref == 'refs/heads/feat/wantedframe-next'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VITE_WFM_BACKEND_URL: "https://api.wfhelper.com"
      VITE_WFM_BACKEND_DIRECT_FALLBACK: "high"
      VITE_WFM_BACKEND_BOOTSTRAP_ENABLED: "1"
    steps:
      - name: Preserve exact source newlines
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck main renderer and tests
        shell: bash
        run: |
          pnpm run typecheck:main
          pnpm run typecheck:renderer
          pnpm run typecheck:tests
      - name: Targeted regression tests
        run: pnpm exec vitest run tests/main/wantedframeNext.test.ts tests/main/rivenRussianIntegration.test.ts tests/main/rewardRussianOcr.test.ts tests/main/rivenScanOcr.test.ts tests/main/personalLoadouts.test.ts tests/main/gameLocale.test.ts
      - name: Set artifact-only version and record provenance
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.2.0-preview.1';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          fs.writeFileSync('source-revision.txt', process.env.GITHUB_SHA + '\n');
          fs.writeFileSync('build-info.json', JSON.stringify({version: pkg.version, revision: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID}, null, 2) + '\n');
          NODE
      - name: Build Windows preview without publishing a release
        shell: bash
        run: |
          pnpm run verify:onnx-models
          pnpm run build
          pnpm exec electron-builder --win nsis --publish never
      - name: Packaged application smoke test
        run: pnpm run test:packaged release/win-unpacked/WantedFrame.exe
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: WantedFrame-0.2.0-preview.1-Windows
          path: |
            release/WantedFrame-0.2.0-preview.1-Setup.exe
            source-revision.txt
            build-info.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WantedFrame-Next-checks
          path: |
            test-results/packaged-*/
            source-revision.txt
            build-info.json
          if-no-files-found: ignore
          retention-days: 7
