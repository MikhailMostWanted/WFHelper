<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc"><title id="title">Синтетическая проверка контракта</title><desc id="desc">Ранг 14, кредиты 12000, платина 0; неизвестный XP null и отсутствующий раздел missing. 53 раздела проверены без игры.</desc><defs><radialGradient id="light"><stop stop-color="#aeb8c8" stop-opacity=".13"/><stop offset="1" stop-color="#08090b" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#9da6b4"/></marker></defs><rect width="1280" height="730" rx="18" fill="#08090b"/><g font-family="Arial,Helvetica,sans-serif" fill="#f5f6f8"><text x="46" y="65" font-size="33" fill="#f5f6f8" font-weight="700">Ноль и отсутствие данных — разные ответы</text><text x="46" y="112" font-size="23" fill="#b7bec8" font-weight="400">Синтетический контракт. Это не экран приложения и не игровой аккаунт.</text><path d="M46 224H1234" stroke="#303740"/><text x="46" y="188" font-size="24" fill="#f5f6f8" font-weight="400">Ранг мастерства</text><text x="485" y="188" font-size="29" fill="#f5f6f8" font-weight="700">14</text><text x="715" y="188" font-size="23" fill="#b7bec8" font-weight="400">Передан источником</text><path d="M46 303H1234" stroke="#303740"/><text x="46" y="267" font-size="24" fill="#f5f6f8" font-weight="400">Кредиты</text><text x="485" y="267" font-size="29" fill="#f5f6f8" font-weight="700">12 000</text><text x="715" y="267" font-size="23" fill="#b7bec8" font-weight="400">Переданы источником</text><path d="M46 382H1234" stroke="#303740"/><text x="46" y="346" font-size="24" fill="#f5f6f8" font-weight="400">Платина</text><text x="485" y="346" font-size="29" fill="#f5f6f8" font-weight="700">0</text><text x="715" y="346" font-size="23" fill="#b7bec8" font-weight="400">Известный нулевой остаток</text><path d="M46 461H1234" stroke="#303740"/><text x="46" y="425" font-size="24" fill="#f5f6f8" font-weight="400">Общий XP мастерства</text><text x="485" y="425" font-size="29" fill="#f5f6f8" font-weight="700">null</text><text x="715" y="425" font-size="23" fill="#b7bec8" font-weight="400">Поле не предоставлено</text><path d="M46 540H1234" stroke="#303740"/><text x="46" y="504" font-size="24" fill="#f5f6f8" font-weight="400">inventory.LongGuns</text><text x="485" y="504" font-size="29" fill="#f5f6f8" font-weight="700">missing</text><text x="715" y="504" font-size="23" fill="#b7bec8" font-weight="400">Нет раздела в источнике</text><text x="46" y="634" font-size="27" fill="#f5f6f8" font-weight="700">53 раздела проходят реальную TS-проекцию → JSON → ZIP.</text><text x="46" y="682" font-size="23" fill="#b7bec8" font-weight="400">Проверено локально: Unicode, round-trip и исключение полей авторизации.</text></g></svg>