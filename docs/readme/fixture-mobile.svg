<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1130" viewBox="0 0 640 1130" role="img" aria-labelledby="title desc"><title id="title">Синтетическая проверка</title><desc id="desc">Пять примеров полей из проверенного синтетического JSON. Нулевой остаток отличается от неизвестных и отсутствующих полей.</desc><defs><radialGradient id="light"><stop stop-color="#aeb8c8" stop-opacity=".13"/><stop offset="1" stop-color="#08090b" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#9da6b4"/></marker></defs><rect width="640" height="1130" rx="18" fill="#08090b"/><g font-family="Arial,Helvetica,sans-serif" fill="#f5f6f8"><text x="36" y="60" font-size="34" fill="#f5f6f8" font-weight="700">Ноль и отсутствие</text><text x="36" y="105" font-size="34" fill="#f5f6f8" font-weight="700">данных различаются</text><text x="36" y="158" font-size="25" fill="#b7bec8" font-weight="400">Синтетический контракт,</text><text x="36" y="194" font-size="25" fill="#b7bec8" font-weight="400">не экран приложения.</text><text x="36" y="252" font-size="27" fill="#b7bec8" font-weight="400">Ранг мастерства</text><text x="36" y="301" font-size="37" fill="#f5f6f8" font-weight="700">14</text><text x="192" y="301" font-size="24" fill="#b7bec8" font-weight="400">Передан источником</text><path d="M36 355H604" stroke="#303740"/><text x="36" y="395" font-size="27" fill="#b7bec8" font-weight="400">Кредиты</text><text x="36" y="444" font-size="37" fill="#f5f6f8" font-weight="700">12 000</text><text x="36" y="480" font-size="24" fill="#b7bec8" font-weight="400">Переданы источником</text><path d="M36 498H604" stroke="#303740"/><text x="36" y="538" font-size="27" fill="#b7bec8" font-weight="400">Платина</text><text x="36" y="587" font-size="37" fill="#f5f6f8" font-weight="700">0</text><text x="192" y="587" font-size="24" fill="#b7bec8" font-weight="400">Известный нулевой остаток</text><path d="M36 641H604" stroke="#303740"/><text x="36" y="681" font-size="27" fill="#b7bec8" font-weight="400">Общий XP мастерства</text><text x="36" y="730" font-size="37" fill="#f5f6f8" font-weight="700">null</text><text x="192" y="730" font-size="24" fill="#b7bec8" font-weight="400">Поле не предоставлено</text><path d="M36 784H604" stroke="#303740"/><text x="36" y="824" font-size="27" fill="#b7bec8" font-weight="400">inventory.LongGuns</text><text x="36" y="873" font-size="37" fill="#f5f6f8" font-weight="700">missing</text><text x="36" y="909" font-size="24" fill="#b7bec8" font-weight="400">Нет раздела в источнике</text><path d="M36 927H604" stroke="#303740"/><text x="36" y="1003" font-size="28" fill="#f5f6f8" font-weight="700">53 раздела: TS → JSON → ZIP</text><text x="36" y="1050" font-size="25" fill="#b7bec8" font-weight="400">Unicode и поля авторизации</text><text x="36" y="1088" font-size="25" fill="#b7bec8" font-weight="400">проверены без запуска игры.</text></g></svg>