<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1090" viewBox="0 0 640 1090" role="img" aria-labelledby="title desc"><title id="title">Поток данных WFHelper</title><desc id="desc">Источник, локальная проекция, интерфейс и экспорт; отдельная загрузка цен.</desc><defs><radialGradient id="light"><stop stop-color="#aeb8c8" stop-opacity=".13"/><stop offset="1" stop-color="#08090b" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#9da6b4"/></marker></defs><rect width="640" height="1090" rx="18" fill="#08090b"/><g font-family="Arial,Helvetica,sans-serif" fill="#f5f6f8"><text x="36" y="58" font-size="34" fill="#f5f6f8" font-weight="700">От источника</text><text x="36" y="104" font-size="34" fill="#f5f6f8" font-weight="700">к понятному снимку</text><rect x="36" y="152" width="568" height="230" fill="#15181e" stroke="#59616f"/><text x="58" y="201" font-size="29" fill="#f5f6f8" font-weight="700">Выбранный источник</text><text x="58" y="258" font-size="26" fill="#b7bec8" font-weight="400">inventory.json / helper</text><text x="58" y="300" font-size="26" fill="#b7bec8" font-weight="400">Импорт AlecaFrame</text><text x="58" y="342" font-size="26" fill="#b7bec8" font-weight="400">Доступные поля снимка</text><path d="M320 388v32" stroke="#9da6b4" marker-end="url(#arrow)"/><rect x="36" y="432" width="568" height="230" fill="#15181e" stroke="#59616f"/><text x="58" y="481" font-size="29" fill="#f5f6f8" font-weight="700">Локальная проекция</text><text x="58" y="538" font-size="26" fill="#b7bec8" font-weight="400">Количества и экземпляры</text><text x="58" y="580" font-size="26" fill="#b7bec8" font-weight="400">Ранги и конфигурации</text><text x="58" y="622" font-size="26" fill="#b7bec8" font-weight="400">Неизвестные поля: null</text><path d="M320 668v32" stroke="#9da6b4" marker-end="url(#arrow)"/><rect x="36" y="712" width="568" height="230" fill="#15181e" stroke="#59616f"/><text x="58" y="761" font-size="29" fill="#f5f6f8" font-weight="700">Интерфейс и экспорт</text><text x="58" y="818" font-size="26" fill="#b7bec8" font-weight="400">Инвентарь и планы сборки</text><text x="58" y="860" font-size="26" fill="#b7bec8" font-weight="400">account-snapshot.json</text><text x="58" y="902" font-size="26" fill="#b7bec8" font-weight="400">JSON / ZIP по действию</text><text x="36" y="1004" font-size="26" fill="#b7bec8" font-weight="400">Цены приходят отдельно.</text><text x="36" y="1044" font-size="24" fill="#b7bec8" font-weight="400">Fixture не проверяет игру или OCR.</text></g></svg>