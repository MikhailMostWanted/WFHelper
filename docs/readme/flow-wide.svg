<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc"><title id="title">Поток данных WFHelper</title><desc id="desc">Выбранный источник проходит локальную проекцию и становится данными интерфейса и экспорта. Цены загружаются отдельно.</desc><defs><radialGradient id="light"><stop stop-color="#aeb8c8" stop-opacity=".13"/><stop offset="1" stop-color="#08090b" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#9da6b4"/></marker></defs><rect width="1280" height="510" rx="18" fill="#08090b"/><g font-family="Arial,Helvetica,sans-serif" fill="#f5f6f8"><text x="46" y="61" font-size="34" fill="#f5f6f8" font-weight="700">От источника к понятному снимку</text><path d="M46 112H410V354H46Z" fill="#15181e" stroke="#59616f"/><text x="68" y="159" font-size="27" fill="#f5f6f8" font-weight="700">Выбранный источник</text><text x="68" y="223" font-size="22" fill="#b7bec8" font-weight="400">inventory.json / helper</text><text x="68" y="267" font-size="22" fill="#b7bec8" font-weight="400">Импорт AlecaFrame</text><text x="68" y="311" font-size="22" fill="#b7bec8" font-weight="400">Доступные поля снимка</text><path d="M458 112H822V354H458Z" fill="#15181e" stroke="#59616f"/><text x="480" y="159" font-size="27" fill="#f5f6f8" font-weight="700">Локальная проекция</text><text x="480" y="223" font-size="22" fill="#b7bec8" font-weight="400">Количества и экземпляры</text><text x="480" y="267" font-size="22" fill="#b7bec8" font-weight="400">Ранги, конфигурации, покрытия</text><text x="480" y="311" font-size="22" fill="#b7bec8" font-weight="400">Неизвестные поля остаются null</text><path d="M870 112H1234V354H870Z" fill="#15181e" stroke="#59616f"/><text x="892" y="159" font-size="27" fill="#f5f6f8" font-weight="700">Интерфейс и экспорт</text><text x="892" y="223" font-size="22" fill="#b7bec8" font-weight="400">Инвентарь и планы сборки</text><text x="892" y="267" font-size="22" fill="#b7bec8" font-weight="400">account-snapshot.json</text><text x="892" y="311" font-size="22" fill="#b7bec8" font-weight="400">JSON / ZIP по действию</text><path d="M418 233h30" stroke="#9da6b4" marker-end="url(#arrow)"/><path d="M830 233h30" stroke="#9da6b4" marker-end="url(#arrow)"/><text x="46" y="422" font-size="22" fill="#b7bec8" font-weight="400">Рыночные цены приходят отдельно: они не подтверждают владение или точную цену продажи.</text><text x="46" y="465" font-size="21" fill="#b7bec8" font-weight="400">Схема существующего кода. Локальный fixture не проверяет игру, OCR и онлайн-сервисы.</text></g></svg>