<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc"><title id="title">WFHelper — личная версия компаньона Warframe</title><desc id="desc">Монохромный знак связанного снаряжения; это оригинальная векторная иллюстрация, не логотип Warframe.</desc><defs><radialGradient id="light"><stop stop-color="#aeb8c8" stop-opacity=".13"/><stop offset="1" stop-color="#08090b" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#9da6b4"/></marker></defs><rect width="1280" height="450" rx="18" fill="#08090b"/><g font-family="Arial,Helvetica,sans-serif" fill="#f5f6f8"><text x="56" y="104" font-size="86" fill="#f5f6f8" font-weight="700">WFHelper</text><text x="59" y="169" font-size="30" fill="#b7bec8" font-weight="400">Личная версия компаньона Warframe</text><text x="59" y="253" font-size="40" fill="#f5f6f8" font-weight="700">Инвентарь. Реликвии.</text><text x="59" y="308" font-size="40" fill="#f5f6f8" font-weight="700">План следующего шага.</text><text x="59" y="396" font-size="22" fill="#b7bec8" font-weight="400">Русский интерфейс и локальный снимок данных</text><g transform="translate(1010 232) scale(1.02)"><circle r="220" fill="url(#light)"/><g fill="none" stroke="#687384"><path d="M0 -142L108 -63L108 63L0 142L-108 63L-108 -63Z"/><path d="M0 -104L79 -46L79 46L0 104L-79 46L-79 -46Z" stroke="#b7bec8"/><path d="M0 -104L0 -32M79 -46L28 -16M79 46L28 16M0 104L0 32M-79 46L-28 16M-79 -46L-28 -16"/><circle r="32" stroke="#f5f6f8"/><circle r="180" stroke-dasharray="1 15"/><path d="M0 -180V-160M180 0H160M0 180V160M-180 0H-160"/></g><path d="M0 -17L15 9H-15Z" fill="#f5f6f8"/><g fill="#f5f6f8"><circle cy="-142" r="5"/><circle cx="108" cy="63" r="5"/><circle cx="-108" cy="63" r="5"/></g></g></g></svg>